name = "nb-factuur"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

# D1 database — create with:
#   npx wrangler d1 create nb-factuur-db
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "nb-factuur-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Company logos are stored as BLOBs directly in D1 (see schema.sql), not R2 —
# R2 requires a payment method on file even to use its free tier, D1 doesn't.

[vars]
# Public, non-secret config. Real secrets (Google OAuth client secret,
# session signing key) are set with `wrangler secret put` — see README.
APP_URL = "http://localhost:8787"
